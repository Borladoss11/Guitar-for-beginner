                const audioCtx = new AudioContext();
                
                const frequencies = [82.41, 110.00, 146.83, 196.00, 246.94, 329.63]; // Standard EADGBe
                const displayOrderFreqs = isLeftHanded ? [...frequencies].reverse() : frequencies;

                displayStrings.forEach((fret, stringIndex) => {
                    if (fret >= 0) {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gainNode = audioCtx.createGain();
                            const baseFreq = displayOrderFreqs[stringIndex];
                            const freq = baseFreq * Math.pow(2, fret / 12);
                            
                            osc.type = 'triangle';
                            osc.frequency.value = freq;
                            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                            osc.connect(gainNode);
                            gainNode.connect(audioCtx.destination);
                            osc.start();
                            osc.stop(audioCtx.currentTime + 1.5);
                        }, stringIndex * 80);
                    }
                });
            };

            return (
                <div className="flex flex-col items-center p-4 bg-white rounded-xl shadow-sm border border-gray-100 w-full hover:border-[#D98B43] transition-colors">
                    <div className="flex justify-between w-full mb-2">
                        <h4 className="font-bold text-xl">{chord.name}</h4>
                        <button onClick={playAudio} className="p-2 rounded-full bg-orange-50 text-[#D98B43] hover:bg-orange-100 transition-colors">
                            <Icon name="Volume2" size={18} />
                        </button>
                    </div>
                    
                    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
                        <rect x={xOffset} y={yOffset} width={stringGap * 5} height={6} fill="#333" />
                        {[0, 1, 2, 3, 4, 5].map(i => (
                            <line key={i} x1={xOffset} y1={yOffset + (i * fretGap)} x2={xOffset + (stringGap * 5)} y2={yOffset + (i * fretGap)} stroke="#ccc" strokeWidth="1" />
                        ))}
                        {[0, 1, 2, 3, 4, 5].map(i => (
                            <line key={i} x1={xOffset + (i * stringGap)} y1={yOffset} x2={xOffset + (i * stringGap)} y2={yOffset + (5 * fretGap)} stroke={i < 2 ? "#d69e2e" : "#888"} strokeWidth={i < 2 ? 3 : 1.5} className="guitar-string" />
                        ))}

                        {displayStrings.map((fret, i) => {
                            const x = xOffset + (i * stringGap);
                            if (fret === -1) return <text key={`mute-${i}`} x={x} y={yOffset - 10} textAnchor="middle" fontSize="14" fill="#ef4444">✕</text>;
                            if (fret === 0) return <circle key={`open-${i}`} cx={x} cy={yOffset - 15} r="4" stroke="#333" strokeWidth="1" fill="none" />;
                            
                            const y = yOffset + (fret * fretGap) - (fretGap / 2);
                            const fingerNum = displayFingers[i];
                            return (
                                <g key={`fret-${i}`}>
                                    <circle cx={x} cy={y} r="10" fill="#D98B43" />
                                    <text x={x} y={y + 4} textAnchor="middle" fill="white" fontSize="12" fontWeight="bold">{fingerNum}</text>
                                </g>
                            );
                        })}
                    </svg>
                    <p className="text-xs text-gray-500 mt-2">{chord.desc_th}</p>
                </div>
            );
        };

        const Hero = ({ t, setPage, setActiveLesson, lessonsData, lang }) => (
            <div className="relative w-full h-[500px] md:h-[600px] bg-gray-900 flex items-center justify-center bg-cover bg-center overflow-hidden" 
                 style={{backgroundImage: "url('https://images.unsplash.com/photo-1549297161-12f5a6058071?q=80&w=2070&auto=format&fit=crop')"}}>
                
                <div className="absolute inset-0 hero-overlay"></div>
                
                <div className="relative z-10 text-center px-4 max-w-3xl mx-auto">
                    <span className="inline-block py-1 px-3 rounded-full bg-[#D98B43] text-white text-sm font-bold tracking-wider mb-6">
                        ONLINE GUITAR COURSE
                    </span>
                    <h1 className="text-4xl md:text-6xl font-bold text-white mb-6 leading-tight drop-shadow-lg">
                        {t.hero.title}
                    </h1>
                    <p className="text-gray-200 text-lg md:text-xl mb-10 font-light">
                        {t.hero.subtitle}
                    </p>
                    <div className="flex flex-col sm:flex-row justify-center gap-4">
                        <button onClick={() => setPage('lessons')} 
                                className="bg-white text-gray-900 font-bold py-4 px-10 rounded-full hover:bg-gray-100 transition-all transform hover:scale-105 shadow-xl border-2 border-white">
                            {t.hero.cta_secondary}
                        </button>
                    </div>
                </div>
            </div>
        );

        const ChordLibrary = ({ t, lang, isLeftHanded, setIsLeftHanded, chordDatabase }) => {
            const [searchTerm, setSearchTerm] = useState("");
            const [filter, setFilter] = useState("all");

            const filteredChords = chordDatabase.filter(chord => {
                const matchesSearch = chord.name.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesFilter = filter === 'all' || 
                                        (filter === 'beginner' && chord.difficulty === 1) ||
                                        (filter === 'barre' && chord.isBarre);
                return matchesSearch && matchesFilter;
            });

            return (
                <div className="p-6 md:p-12 max-w-7xl mx-auto pb-24">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <h2 className="text-3xl font-bold text-gray-800">{t.chords.title}</h2>
                        <div className="flex items-center gap-4">
                            <span className="text-sm font-medium text-gray-500">Mode:</span>
                            <button 
                                onClick={() => setIsLeftHanded(!isLeftHanded)}
                                className={`text-sm px-4 py-2 rounded-full border transition-all ${isLeftHanded ? 'bg-[#D98B43] text-white border-[#D98B43]' : 'bg-white text-gray-600 border-gray-300 hover:border-[#D98B43]'}`}>
                                {isLeftHanded ? t.chords.left_hand : t.chords.right_hand}
                            </button>
                        </div>
                    </div>
                    
                    <div className="relative mb-8">
                        <input 
                            type="text" 
                            placeholder={t.chords.search_placeholder}
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="w-full p-4 pl-12 rounded-2xl border border-gray-200 shadow-sm focus:ring-2 focus:ring-[#D98B43] outline-none text-lg"
                        />
                        <div className="absolute left-4 top-5 text-gray-400">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </div>
                    </div>

                    <div className="flex gap-2 mb-8 overflow-x-auto hide-scrollbar pb-2">
                        {['all', 'beginner', 'barre'].map(f => (
                            <button 
                                key={f}
                                onClick={() => setFilter(f)}
                                className={`px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all ${filter === f ? 'bg-[#2B2B2B] text-white shadow-md' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}`}>
                                {f === 'all' ? t.chords.filter_all : 
                                    f === 'beginner' ? t.chords.filter_beginner : t.chords.filter_barre}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                        {filteredChords.map((chord, idx) => (
                            <ChordDiagram key={idx} chord={{
                                ...chord,
                                desc_th: lang === 'th' ? chord.desc_th : chord.desc_en
                            }} isLeftHanded={isLeftHanded} />
                        ))}
                    </div>
                    {filteredChords.length === 0 && (
                        <div className="text-center py-20 text-gray-400">
                            No chords found matching "{searchTerm}"
                        </div>
                    )}
                </div>
            );
        };

        const ActiveLesson = ({ activeLesson, setActiveLesson, lang, t, isLeftHanded, chordDatabase }) => {
            if (!activeLesson) return null;
            const content = lang === 'th' ? activeLesson.desc_th : activeLesson.desc_en;
            
            return (
                <div className="fixed inset-0 bg-[#FDFBF7] z-50 overflow-y-auto">
                    <div className="max-w-4xl mx-auto bg-white min-h-screen shadow-2xl">
                        {/* Header */}
                        <div className="sticky top-0 bg-white/95 backdrop-blur-md p-4 border-b flex items-center justify-between z-10">
                            <button onClick={() => setActiveLesson(null)} className="p-2 hover:bg-gray-100 rounded-full transition-colors">
                                <Icon name="ChevronLeft" size={24} />
                            </button>
                            <span className="font-bold text-gray-500 text-sm tracking-widest">
                                {lang === 'th' && activeLesson.customLabel_th ? activeLesson.customLabel_th : `DAY ${activeLesson.day}`}
                            </span>
                            <div className="w-8"></div>
                        </div>

                        {/* Video / Content */}
                        {activeLesson.videoId ? (
                            <div className="w-full aspect-video bg-black relative">
                                <iframe 
                                    className="w-full h-full"
                                    src={`https://www.youtube.com/embed/${activeLesson.videoId}?rel=0&playsinline=1`} 
                                    title="YouTube video player" 
                                    frameBorder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                    allowFullScreen
                                ></iframe>
                            </div>
                        ) : (
                             activeLesson.externalLink ? (
                                <a href={activeLesson.externalLink} target="_blank" rel="noopener noreferrer" className="w-full aspect-video bg-black flex items-center justify-center relative group cursor-pointer block overflow-hidden">
                                    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1510915361894-db8b60106cb1?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center opacity-70 group-hover:opacity-60 transition-opacity duration-300"></div>
                                    <div className="relative z-10 w-24 h-24 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center group-hover:scale-110 transition-transform duration-300 shadow-xl border border-white/30">
                                        <Icon name="Play" size={40} fill="white" className="text-white ml-2" />
                                    </div>
                                    <div className="absolute bottom-6 left-1/2 transform -translate-x-1/2 text-white font-bold bg-black/60 px-6 py-2 rounded-full backdrop-blur-sm border border-white/20 flex items-center gap-2 shadow-lg group-hover:bg-black/70 transition-colors">
                                        <Icon name="ExternalLink" size={16} />
                                        <span>คลิกเพื่อดูวิดีโอ (YouTube)</span>
                                    </div>
                                </a>
                            ) : (
                                <div className="w-full aspect-video bg-black flex items-center justify-center relative group cursor-pointer">
                                    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1510915361894-db8b60106cb1?q=80&w=2070&auto=format&fit=crop')] bg-cover opacity-60 group-hover:opacity-50 transition-opacity"></div>
                                    <div className="relative z-10 w-20 h-20 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
                                        <Icon name="Play" size={40} fill="white" className="text-white ml-1" />
                                    </div>
                                </div>
                            )
                        )}
                        
                        {/* Video ID link (if videoId present) OR External Link Text fallback */}
                        {(activeLesson.videoId || activeLesson.externalLink) && (
                            <div className="bg-gray-50 border-b border-gray-100 p-3 text-center">
                                <a 
                                    href={activeLesson.externalLink || `https://www.youtube.com/watch?v=${activeLesson.videoId}`} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="text-xs text-[#D98B43] hover:underline flex items-center justify-center gap-1 font-medium"
                                >
                                    <Icon name="ExternalLink" size={12} />
                                    {lang === 'th' ? "หากวิดีโอเล่นไม่ได้ หรือต้องการดูต้นฉบับ คลิกที่นี่" : "Watch original video on YouTube"}
                                </a>
                            </div>
                        )}
                        
                        {activeLesson.credit && (
                            <div className="p-4 bg-gray-50 text-xs text-gray-500 text-center border-b">
                                {activeLesson.credit}
                            </div>
                        )}

                        <div className="p-8 pb-32">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                                <h1 className="text-3xl font-bold text-gray-900">{lang === 'th' ? activeLesson.title_th : activeLesson.title_en}</h1>
                                <div className="flex gap-3">
                                    <span className="px-3 py-1 bg-gray-100 rounded-lg text-sm font-medium text-gray-600 flex items-center gap-2">
                                        <Icon name="BookOpen" size={16}/> {activeLesson.level_en}
                                    </span>
                                    {activeLesson.duration && (
                                        <span className="px-3 py-1 bg-gray-100 rounded-lg text-sm font-medium text-gray-600 flex items-center gap-2">
                                            <Icon name="Play" size={16}/> {activeLesson.duration} {t.common.minutes}
                                        </span>
                                    )}
                                </div>
                            </div>

                            <div className="prose prose-lg max-w-none text-gray-600 leading-relaxed">
                                <p className="mb-8 text-lg">{content}</p>
                            </div>
                        </div>

                        {/* Floating Footer */}
                        <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 pb-8 md:pb-4 z-20">
                            <div className="max-w-4xl mx-auto flex justify-between items-center px-4">
                                <button onClick={() => setActiveLesson(null)} className="text-gray-500 font-bold text-sm hover:text-gray-800 transition-colors">{t.common.back}</button>
                                <button className="bg-[#D98B43] text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-[#b57030] hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                                    Complete Lesson
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LessonsList = ({ lessonsData, setActiveLesson, lang, t }) => (
            <div className="p-4 md:p-12 max-w-4xl mx-auto">
                <div className="flex items-center gap-3 mb-8">
                    <div className="w-1 h-8 bg-[#D98B43] rounded-full"></div>
                    <h2 className="text-3xl font-bold text-gray-800">{t.nav.lessons}</h2>
                </div>
                <div className="grid gap-6">
                    {lessonsData.map(lesson => (
                        <div key={lesson.id} 
                                onClick={() => !lesson.locked && setActiveLesson(lesson)}
                                className={`bg-white p-6 md:p-8 rounded-2xl border border-gray-100 flex items-center gap-6 transition-all ${lesson.locked ? 'opacity-50 grayscale' : 'cursor-pointer shadow-sm hover:shadow-lg hover:border-orange-100 hover:scale-[1.01]'}`}>
                            <div className={`w-16 h-16 rounded-2xl flex items-center justify-center font-bold text-white text-2xl shadow-md ${lesson.completed ? 'bg-green-500' : 'bg-[#D98B43]'}`}>
                                {lesson.completed ? '✓' : lesson.day}
                            </div>
                            <div className="flex-1">
                                <div className="text-xs font-bold text-[#D98B43] uppercase mb-1 tracking-wider flex items-center gap-2">
                                    <span>
                                        {lang === 'th' && lesson.customLabel_th ? lesson.customLabel_th : `DAY ${lesson.day}`}
                                    </span>
                                    {lesson.duration && (
                                        <>
                                            <span className="w-1 h-1 bg-gray-300 rounded-full"></span>
                                            <span>{lesson.duration} {t.common.minutes}</span>
                                        </>
                                    )}
                                </div>
                                <h4 className="font-bold text-xl md:text-2xl text-gray-800 mb-2">{lang === 'th' ? lesson.title_th : lesson.title_en}</h4>
                                <p className="text-gray-500 text-sm md:text-base leading-relaxed">{lang === 'th' ? lesson.desc_th : lesson.desc_en}</p>
                            </div>
                            <div className="hidden md:block">
                                {!lesson.locked && <div className="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-[#D98B43]">
                                    <Icon name="Play" size={20} className="ml-1"/>
                                </div>}
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        // 4. MAIN APP CONTAINER
        const App = () => {
            const [lang, setLang] = useState('th'); // 'th' or 'en'
            const [page, setPage] = useState('home'); // home, lessons, chords
            const [activeLesson, setActiveLesson] = useState(null);
            const [isLeftHanded, setIsLeftHanded] = useState(false);

            const t = translations[lang];
            const toggleLang = () => setLang(l => l === 'th' ? 'en' : 'th');

            // --- LAYOUT ---
            return (
                <div className="min-h-screen pb-20 md:pb-0 font-sans bg-[#FDFBF7]">
                    {/* Header */}
                    <header className="sticky top-0 bg-white/90 backdrop-blur-md z-40 px-6 py-4 border-b border-gray-100 flex justify-between items-center shadow-sm">
                        <div 
                            className="font-bold text-xl tracking-tight flex items-center gap-2 cursor-pointer"
                            onClick={() => { setPage('home'); setActiveLesson(null); }}
                        >
                            <span className="bg-[#D98B43] text-white w-9 h-9 flex items-center justify-center rounded-xl shadow-sm">G</span>
                            <span className="text-gray-800">Guitarforbeginner</span>
                        </div>
                        
                        {/* Desktop Menu */}
                        <div className="hidden md:flex items-center gap-8">
                            <button onClick={() => setPage('home')} className={`font-medium transition-colors ${page === 'home' ? 'text-[#D98B43]' : 'text-gray-500 hover:text-gray-800'}`}>{t.nav.home}</button>
                            <button onClick={() => setPage('lessons')} className={`font-medium transition-colors ${page === 'lessons' ? 'text-[#D98B43]' : 'text-gray-500 hover:text-gray-800'}`}>{t.nav.lessons}</button>
                            <button onClick={() => setPage('chords')} className={`font-medium transition-colors ${page === 'chords' ? 'text-[#D98B43]' : 'text-gray-500 hover:text-gray-800'}`}>{t.nav.chords}</button>
                        </div>

                        <button 
                            onClick={toggleLang}
                            className="text-xs font-bold px-3 py-1.5 rounded-full border border-gray-200 hover:bg-gray-50 transition-colors text-gray-600 tracking-wide">
                            {lang === 'th' ? 'TH / EN' : 'EN / TH'}
                        </button>
                    </header>

                    {/* Main Content Area */}
                    <main>
                        {activeLesson ? (
                            <ActiveLesson 
                                activeLesson={activeLesson} 
                                setActiveLesson={setActiveLesson} 
                                lang={lang} 
                                t={t} 
                                isLeftHanded={isLeftHanded} 
                                chordDatabase={chordDatabase} 
                            />
                        ) : (
                            <>
                                {page === 'home' && (
                                    <>
                                        <Hero t={t} setPage={setPage} setActiveLesson={setActiveLesson} lessonsData={lessonsData} lang={lang} />
                                    </>
                                )}
                                {page === 'lessons' && <LessonsList lessonsData={lessonsData} setActiveLesson={setActiveLesson} lang={lang} t={t} />}
                                {page === 'chords' && <ChordLibrary t={t} lang={lang} isLeftHanded={isLeftHanded} setIsLeftHanded={setIsLeftHanded} chordDatabase={chordDatabase} />}
                            </>
                        )}
                    </main>

                    {/* Mobile Navigation */}
                    {!activeLesson && (
                        <nav className="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-200 py-2 px-6 flex justify-around items-center z-50 md:hidden pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
                            <button onClick={() => setPage('home')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-colors ${page === 'home' ? 'text-[#D98B43] bg-orange-50' : 'text-gray-400'}`}>
                                <Icon name="Home" size={24} />
                            </button>
                            <button onClick={() => setPage('lessons')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-colors ${page === 'lessons' ? 'text-[#D98B43] bg-orange-50' : 'text-gray-400'}`}>
                                <Icon name="BookOpen" size={24} />
                            </button>
                            <button onClick={() => setPage('chords')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-colors ${page === 'chords' ? 'text-[#D98B43] bg-orange-50' : 'text-gray-400'}`}>
                                <Icon name="Music" size={24} />
                            </button>
                        </nav>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
